<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PiShock Activity</title>
    <base href="/" />
    <style>
        /* Official site uses font-family: geo — Google Fonts blocked by Discord CSP */
        html, body, .q-layout {
            background: #121212;
        }
        body { margin: 0; }
    </style>
    <!-- Official PiShock / Quasar stylesheet (font URLs point at /fonts) -->
    <link rel="stylesheet" href="css/vendor/pishock/app.cdn.css" />
    <link rel="stylesheet" href="css/vendor/pishock/chunk-common.css" />
    <link rel="stylesheet" href="css/vendor/pishock/control.css" />
    <link rel="stylesheet" href="css/vendor/pishock/mdi.css" />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/app.css" />
    <!-- Scoped Blazor bundle is optional; omit when the project has no *.razor.css -->
</head>
<body>
    <div id="app">
        <div class="auth-boot" role="status">
            <div class="auth-boot__glow"></div>
            <div class="auth-boot__panel">
                <h1 class="auth-boot__brand"><span class="auth-boot__brand-name">Pi<span>Shock</span></span></h1>
                <p class="auth-boot__sub">Loading activity…</p>
            </div>
        </div>
    </div>
    <div id="blazor-error-ui" style="display:none">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="js/discordSdk.vendor.js?v=3"></script>
    <script src="js/discordActivity.js?v=3"></script>
    <script src="js/activitySocket.js?v=3"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
