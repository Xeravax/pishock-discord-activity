<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Share card preview</title>
    <style>
      body { margin: 0; background: #16191c; color: #d5dde2; font-family: system-ui, sans-serif; }
      h1 { margin: 16px 20px 8px; font-size: 18px; font-weight: 650; }
      p { margin: 0 20px 16px; color: #9aa6ae; }
      img { display: block; width: min(1100px, 100%); height: auto; margin: 0 16px 20px; }
    </style>
  </head>
  <body>
    <h1>PiShock share cards</h1>
    <p id="status">Rendering the looping GIFs…</p>
    <div id="root"></div>
    <script type="module">
      import { renderLogShareCard } from './logShareCard.ts';
      function avatar(bg, letter) {
        const c = document.createElement('canvas');
        c.width = c.height = 256;
        const g = c.getContext('2d');
        g.fillStyle = bg;
        g.beginPath();
        g.arc(128, 128, 128, 0, Math.PI * 2);
        g.fill();
        g.fillStyle = '#fff';
        g.font = '700 120px sans-serif';
        g.textAlign = 'center';
        g.textBaseline = 'middle';
        g.fillText(letter, 128, 138);
        return c.toDataURL('image/png');
      }
      const people = {
        from: { id: '1', displayName: 'Xeravax', avatarUrl: avatar('#3d6ea8', 'X') },
        to: { id: '2', displayName: 'Sukaru', avatarUrl: avatar('#c47a3a', 'S') },
        fromLabel: 'Xeravax',
        toLabel: 'Sukaru',
      };
      const loc = { kind: 'gc', name: 'My Discord Server', iconUrl: null, guildId: '1', channelId: '2' };
      const base = {
        viaApi: false, shockerId: 1, shockerName: null, hubClientId: null, hubName: null,
        at: Date.now(), source: 'discord', location: loc, ...people,
      };
      const cards = [
        { ...base, id: 's', action: 'shock', intensity: 42, durationSec: 5 },
        { ...base, id: 'v', action: 'vibrate', intensity: 15, durationSec: 1.5 },
        { ...base, id: 'b', action: 'beep', intensity: 8, durationSec: 2 },
      ];
      const root = document.querySelector('#root');
      const status = document.querySelector('#status');
      for (const entry of cards) {
        status.textContent = `Rendering ${entry.action}…`;
        const blob = await renderLogShareCard(entry);
        const img = document.createElement('img');
        img.alt = entry.action;
        img.src = URL.createObjectURL(blob);
        root.append(img);
      }
      status.textContent = 'Looping GIFs. Shock, vibrate, then beep.';
    </script>
  </body>
</html>
