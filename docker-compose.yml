# PiShock Activity (.NET 10) — published GHCR image plus Postgres.
#
#   cp .env.example .env
#   # fill DISCORD_CLIENT_SECRET, TOKEN_KEY, PUBLIC_URL
#   # DISCORD_CLIENT_ID must match the id baked into this image
#   docker compose pull
#   docker compose up -d
#
# App:    http://localhost:3000
# Health: http://localhost:3000/api/health
# Demo:   http://localhost:3000/?demo
#
# DATABASE_URL inside the app container is always the Compose hostname `db`.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pishock
      POSTGRES_PASSWORD: pishock
      POSTGRES_DB: pishock
    volumes:
      - pishock_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pishock -d pishock"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - internal

  app:
    image: ghcr.io/xeravax/pishock-discord-activity:feature-dnet10
    restart: unless-stopped
    stop_grace_period: 10s
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:3000
      PORT: "3000"
      DATABASE_URL: postgresql://pishock:pishock@db:5432/pishock
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:?Set DISCORD_CLIENT_ID in .env}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:?Set DISCORD_CLIENT_SECRET in .env}
      TOKEN_KEY: ${TOKEN_KEY:?Set TOKEN_KEY in .env}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_PUBLIC_KEY: ${DISCORD_PUBLIC_KEY:-}
      REQUIRE_DISCORD_PROXY_AUTH: ${REQUIRE_DISCORD_PROXY_AUTH:-0}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 50s
    networks:
      - internal

volumes:
  pishock_pgdata:

networks:
  internal:
    driver: bridge
