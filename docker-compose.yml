services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pishock
      POSTGRES_PASSWORD: pishock
      POSTGRES_DB: pishock
    volumes:
      - pishock_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pishock -d pishock"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      args:
        VITE_DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://pishock:pishock@db:5432/pishock?schema=public}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_PUBLIC_KEY: ${DISCORD_PUBLIC_KEY:-}
      REQUIRE_DISCORD_PROXY_AUTH: ${REQUIRE_DISCORD_PROXY_AUTH:-0}
      TOKEN_KEY: ${TOKEN_KEY}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      PORT: "3000"
      VITE_DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pishock_pgdata:
