# Local build + run
#   cp .env.example .env   # fill secrets
#   docker compose up --build -d
#
# Required in .env: DISCORD_CLIENT_ID, DISCORD_CLIENT_SECRET, TOKEN_KEY, PUBLIC_URL
# DATABASE_URL is set below for the compose network (override in .env if needed).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pishock
      POSTGRES_PASSWORD: pishock
      POSTGRES_DB: pishock
    volumes:
      - pishock_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pishock -d pishock"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - internal

  app:
    build:
      context: .
      args:
        # Baked into the client bundle — must match DISCORD_CLIENT_ID
        VITE_DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:?Set DISCORD_CLIENT_ID in .env}
        GIT_SHA: ${GIT_SHA:-local}
        GIT_REF_NAME: ${GIT_REF_NAME:-local}
        GIT_REF_TYPE: ${GIT_REF_TYPE:-branch}
    image: pishock-activity:local
    restart: unless-stopped
    stop_grace_period: 10s
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      # Compose network hostname; wins over env_file if both set
      DATABASE_URL: ${DATABASE_URL:-postgresql://pishock:pishock@db:5432/pishock?schema=public}
      PORT: "3000"
      NODE_ENV: production
      DATA_DIR: /app/data
    volumes:
      - pishock_appdata:/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 50s
    networks:
      - internal

volumes:
  pishock_pgdata:
  pishock_appdata:

networks:
  internal:
    driver: bridge
