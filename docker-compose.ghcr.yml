# Published image from GHCR (no local build)
#   cp .env.example .env   # fill secrets
#   docker compose -f docker-compose.ghcr.yml --env-file .env up -d
#
# Override image tag / port via .env:
#   PISHOCK_IMAGE=ghcr.io/xeravax/pishock-discord-activity:develop
#   PORT=3001

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pishock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pishock}
      POSTGRES_DB: ${POSTGRES_DB:-pishock}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-pishock} -d ${POSTGRES_DB:-pishock}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - internal

  app:
    image: ${PISHOCK_IMAGE:-ghcr.io/xeravax/pishock-discord-activity:develop}
    restart: unless-stopped
    stop_grace_period: 10s
    ports:
      - "${PORT:-3001}:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://pishock:pishock@db:5432/pishock?schema=public}
      PORT: "3000"
      ASPNETCORE_ENVIRONMENT: Production
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 50s
    networks:
      - internal

networks:
  internal:
    driver: bridge
