name: Publish Docker image

on:
  push:
    branches: [release, develop]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build and push
    # Pin until ready for ubuntu-26 (ubuntu-latest migrates Oct 2026)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set image name (GHCR requires lowercase)
        run: |
          owner_repo="${GITHUB_REPOSITORY,,}"
          echo "IMAGE_NAME=${{ env.REGISTRY }}/${owner_repo}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/release' }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Build-time only. Runtime secrets come from .env / compose (never bake secrets into the image).
          # Optional repo Variable: Settings → Secrets and variables → Actions → Variables → DISCORD_CLIENT_ID
          build-args: |
            VITE_DISCORD_CLIENT_ID=${{ vars.DISCORD_CLIENT_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Make package public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Package name is the repo name (or last path segment for nested names)
          pkg="${GITHUB_REPOSITORY##*/}"
          pkg="${pkg,,}"
          owner="${GITHUB_REPOSITORY_OWNER}"
          echo "Setting ghcr.io/${owner}/${pkg} visibility to public…"
          if gh api --method GET "/orgs/${owner}" >/dev/null 2>&1; then
            gh api --method PUT \
              -H "Accept: application/vnd.github+json" \
              "/orgs/${owner}/packages/container/${pkg}/visibility" \
              -f visibility=public || true
          else
            gh api --method PUT \
              -H "Accept: application/vnd.github+json" \
              "/user/packages/container/${pkg}/visibility" \
              -f visibility=public || true
          fi
