name: Tests

on:
  pull_request:
  push:
    branches: [release, develop, main, feature/dnet10]
  workflow_dispatch:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Safety gates (xUnit)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore PiShock.Activity.sln
      - name: Test
        run: dotnet test PiShock.Activity.sln --configuration Release --no-restore
        env:
          DATABASE_URL: postgresql://pishock:pishock@127.0.0.1:5432/pishock
          DISCORD_CLIENT_ID: test
          DISCORD_CLIENT_SECRET: test
          TOKEN_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          PUBLIC_URL: http://localhost:3000
