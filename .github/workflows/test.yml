name: Tests

on:
  pull_request:
  push:
    branches: [release, develop]
  workflow_dispatch:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, typecheck, safety tests
    # Pin until ready for ubuntu-26 (ubuntu-latest migrates Oct 2026)
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pishock
          POSTGRES_PASSWORD: pishock
          POSTGRES_DB: pishock_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pishock"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://pishock:pishock@127.0.0.1:5432/pishock_test?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck server and client
        run: npm run typecheck

      - name: Run server tests
        run: npm test

      - name: Run client tests
        run: npm run test:client

      - name: Audit production dependencies
        # Advisory only: the current high finding is a nested zod inside
        # @discord/embedded-app-sdk with no upstream fix. Drop continue-on-error once
        # `npm audit` is clean so new vulnerabilities start blocking.
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
