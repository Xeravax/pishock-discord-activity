name: Tests (optional)

on:
  pull_request:
  push:
    branches: [release, develop]
  workflow_dispatch:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Safety gates + typecheck
    # Pin until ready for ubuntu-26 (ubuntu-latest migrates Oct 2026)
    runs-on: ubuntu-24.04
    # Keep this check visible without blocking merges unless you later make it required.
    continue-on-error: true
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        env:
          # Generate only — Prisma does not connect during generate.
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build?schema=public
        run: npx prisma generate

      - name: Run safety gate tests
        run: npm test

      - name: Typecheck server and client
        run: npm run typecheck
